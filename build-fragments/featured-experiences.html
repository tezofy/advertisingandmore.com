    /* ── v4.40 : reference mosaic (IMG_1970 (1)) ─────────────────────────────
       copy  |  one large frame  |  2 tiles on the top row, 3 on the bottom.

    .fe-playground {
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.26fr) minmax(0, 1.02fr);
      align-items: center;
      gap: clamp(18px, 2.4vw, 34px);

        font-size: clamp(1.65rem, 2.18vw, 2.2rem);

      }
    }

    .fe-gallery {
      display: grid;
      grid-template-columns: minmax(0, 1.26fr) minmax(0, 1.02fr);
      gap: clamp(8px, .8vw, 11px);
      align-items: stretch;
      grid-column: 2 / -1;
    }
    .fe-shot {
      position: relative;
      margin: 0;
      overflow: hidden;

      background: #0B1E3F;
    }
    .fe-shot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .7s cubic-bezier(.16, 1, .3, 1);
    }
    .fe-shot:hover img { transform: scale(1.05); }

    .fe-shot--big { min-height: 100%; }

    /* the reference leaves the top-right corner of the cluster empty (for the
       crown doodle), so the top row is two tiles of 5/12 and the bottom row is
       4 + 3 + 5 — measured off IMG_1970 (1). */
    .fe-mosaic {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      grid-template-rows: 67fr 105fr;
      aspect-ratio: 274 / 182;
      gap: clamp(8px, .8vw, 11px);
    }
    .fe-mosaic .fe-shot { height: 100%; min-height: 0; }
    .fe-mosaic .fe-shot:nth-child(1) { grid-column: 1 / span 5; grid-row: 1; }
    .fe-mosaic .fe-shot:nth-child(2) { grid-column: 6 / span 5; grid-row: 1; }
    .fe-mosaic .fe-shot:nth-child(3) { grid-column: 1 / span 4; grid-row: 2; }
    .fe-mosaic .fe-shot:nth-child(4) { grid-column: 5 / span 3; grid-row: 2; }
    .fe-mosaic .fe-shot:nth-child(5) { grid-column: 8 / span 5; grid-row: 2; }

    /* gold doodles, exactly where the reference places them */
    .fe-doodle { position: absolute; color: #D5A021; pointer-events: none; }
    .fe-doodle--arrow {
      top: 50%; right: -30px;
      width: 26px; height: 26px;
      transform: translateY(-50%);
      opacity: .95;
    }
    .fe-mosaic .fe-doodle--crown {
      position: static;
      grid-column: 11 / -1;
      grid-row: 1;
      align-self: start;
      justify-self: end;
      width: 24px; height: 24px;
      margin: -2px 2px 0 0;
      opacity: .9;

    @media (max-width: 1180px) {
      .fe-playground { grid-template-columns: minmax(0, 1fr); }

    @media (max-width: 760px) {

      if (!link) return;
      link.addEventListener('click', function () {
        var cat = link.getAttribute('data-fe-cat');
        if (!cat) return;

        window.setTimeout(function () {
          var tab = document.querySelector('.category-tabs-nav .tab-pill-btn[data-cat="' + cat + '"]');
          if (tab) {
            tab.click();
            tab.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        }, 60);

        card.classList.add('is-active');
        window.setTimeout(function () { card.classList.remove('is-active'); }, 1200);
      });
    });
